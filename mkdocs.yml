site_name: Notebook
site_description: Personal knowledge base for biology, computing, data science, frontend, and productivity notes.
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  features:
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

exclude_docs: |
  .git/
  .git/**
  site/
  site/**
  **/__pycache__/**
  **/*.pyc

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
