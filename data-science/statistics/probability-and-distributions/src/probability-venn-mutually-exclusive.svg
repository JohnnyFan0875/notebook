<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220">
  <rect width="420" height="220" fill="#ffffff"/>
  <rect x="25" y="25" width="370" height="170" rx="8" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="145" cy="110" r="55" fill="#4c956c" fill-opacity="0.85" stroke="#333" stroke-width="2"/>
  <circle cx="275" cy="110" r="55" fill="#4c956c" fill-opacity="0.85" stroke="#333" stroke-width="2"/>
  <text x="145" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#222">A</text>
  <text x="275" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#222">B</text>
